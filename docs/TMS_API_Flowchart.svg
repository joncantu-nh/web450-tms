<text x="411" y="337" class="status" text-anchor="start">Path ID (MongoDB _id)</text>
<text x="411" y="353" class="status" text-anchor="start">HTTP responses: 200, 400, 404, 500</text>
<rect x="400" y="371" width="322" height="84" rx="8" fill="#ffffff" stroke="#ccd6e2"/>
<text x="411" y="392" class="method" text-anchor="start">PATCH</text>
<text x="411" y="414" class="label" text-anchor="start">Update a task</text>
<text x="411" y="431" class="status" text-anchor="start">Path ID + JSON body</text>
<text x="411" y="447" class="status" text-anchor="start">HTTP responses: 200, 400, 404, 409, 500</text>
<rect x="400" y="465" width="322" height="84" rx="8" fill="#ffffff" stroke="#ccd6e2"/>
<text x="411" y="486" class="method" text-anchor="start">DELETE</text>
<text x="411" y="508" class="label" text-anchor="start">Delete a task</text>
<text x="411" y="525" class="status" text-anchor="start">Path ID (MongoDB _id)</text>
<text x="411" y="541" class="status" text-anchor="start">HTTP responses: 200, 400, 404, 500</text>
<rect x="756" y="225" width="342" height="344" rx="8" fill="#f7f9fc" stroke="#c6d1de"/>
<rect x="756" y="225" width="342" height="42" rx="8" fill="#254b6e" stroke="none"/>
<text x="927" y="252" class="route" text-anchor="middle">/api/projects</text>
<rect x="766" y="277" width="322" height="84" rx="8" fill="#ffffff" stroke="#ccd6e2"/>
<text x="777" y="298" class="method" text-anchor="start">GET</text>
<text x="777" y="320" class="label" text-anchor="start">List all projects</text>
<text x="777" y="337" class="status" text-anchor="start">No request body</text>
<text x="777" y="353" class="status" text-anchor="start">HTTP responses: 200, 500</text>
<rect x="766" y="371" width="322" height="84" rx="8" fill="#ffffff" stroke="#ccd6e2"/>
<text x="777" y="392" class="method" text-anchor="start">POST</text>
<text x="777" y="414" class="label" text-anchor="start">Create a project</text>
<text x="777" y="431" class="status" text-anchor="start">JSON request body</text>
<text x="777" y="447" class="status" text-anchor="start">HTTP responses: 201, 400, 500</text>
<path d="M195 569 V597" fill="none" stroke="#64758a" stroke-width="2"/>
<path d="M561 569 V597" fill="none" stroke="#64758a" stroke-width="2"/>
<path d="M927 569 V597" fill="none" stroke="#64758a" stroke-width="2"/>
<path d="M195 597 H927 M573 597 V628" fill="none" stroke="#64758a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="348" y="631" width="450" height="66" rx="8" fill="#e9f0f7" stroke="#9cb2c9"/>
<text x="573" y="655" class="label" text-anchor="middle">Mongoose / MongoDB Atlas</text>
<text x="573" y="677" class="detail" text-anchor="middle">projects · tasks · counters (IDs on create)</text>
<text x="573" y="724" class="detail" text-anchor="middle">API returns the result or an error to the Angular client.</text>
<text x="573" y="744" class="detail" text-anchor="middle">2xx: success   ·   400: invalid input   ·   404: not found   ·   409: duplicate title   ·   500: server error</text>
<text x="573" y="768" class="status" text-anchor="middle">Generated from tms-server/openapi.yaml</text>
</svg>
