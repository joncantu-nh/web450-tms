<text x="45" y="337" class="status" text-anchor="start">No request body</text>
<text x="45" y="353" class="status" text-anchor="start">HTTP responses: 200, 400, 500</text>
<rect x="34" y="371" width="322" height="84" rx="8" fill="#ffffff" stroke="#ccd6e2"/>
<text x="45" y="392" class="method" text-anchor="start">GET</text>
<text x="45" y="414" class="label" text-anchor="start">Search tasks</text>
<text x="45" y="431" class="status" text-anchor="start">taskTitle, taskDueDate</text>
<text x="45" y="447" class="status" text-anchor="start">HTTP responses: 200, 400, 500</text>
<rect x="34" y="465" width="322" height="84" rx="8" fill="#ffffff" stroke="#ccd6e2"/>
<text x="45" y="486" class="method" text-anchor="start">POST</text>
<text x="45" y="508" class="label" text-anchor="start">Create a task</text>
<text x="45" y="525" class="status" text-anchor="start">JSON request body</text>
<text x="45" y="541" class="status" text-anchor="start">HTTP responses: 201, 400, 404, 409, 500</text>
<rect x="390" y="225" width="342" height="344" rx="8" fill="#f7f9fc" stroke="#c6d1de"/>
<rect x="390" y="225" width="342" height="42" rx="8" fill="#254b6e" stroke="none"/>
<text x="561" y="252" class="route" text-anchor="middle">/api/tasks/{id}</text>
