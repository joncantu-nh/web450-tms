openapi: 3.1.0
info:
  title: Task Management System API
  version: 1.0.0
paths:
  /api/projects:
    post:
      operationId: addProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProject'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddProjectResponse'
        '400':
          description: Invalid project data
        '500':
          description: Database or server error
components:
  schemas:
    AddProject:
      type: object
      required: [name, startDate]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '\S'
        description:
          type: string
        startDate:
          $ref: '#/components/schemas/ProjectDate'
        endDate:
          description: Must be after startDate if supplied
          $ref: '#/components/schemas/ProjectDate'
    ProjectDate:
      anyOf:
        - type: string
          format: date
        - type: string
          format: date-time
    AddProjectResponse:
      type: object
      required: [message, projectId]
      properties:
        message:
          type: string
        projectId:
          type: integer
    TaskStatus:
      type: string
      enum:
        - Pending
        - In Progress
        - Completed
    TaskPriority:
      type: string
      enum:
        - Low
        - Medium
        - High
